[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ardea-avo"
version = "0.1.0"
description = "A paper-faithful AVO engine and auditable ARC-AGI-3 reproduction harness"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ardea AI Corp" }]
dependencies = [
  "anthropic>=1.3,<2",
  "arc-agi==0.9.9",
  "arcengine==0.9.3",
  "mcp>=1.26,<2",
  "openai>=2.21,<3",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "PyYAML>=6.0.2,<7",
  "rich>=14.3,<15",
]

[project.scripts]
app = "ardea_avo.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.19,<2",
  "pytest>=9.0,<10",
  "pytest-cov>=7.0,<8",
  "ruff>=0.15,<1",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ardea_avo"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
packages = ["ardea_avo"]
